<!doctype html>

  <head>

    <title>Dorixona — internet yo'q</title>
    <style>
      body { margin: 0; display: grid; place-items: center; min-height: 100vh;
             font-family: system-ui, sans-serif; background: #f6f8f7; color: #1c2024; }
      .box { text-align: center; padding: 24px; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { margin: 0 0 16px; color: #6b7280; font-size: 14px; }
      button { background: #1a7f5a; color: #fff; border: 0; border-radius: 10px;
               padding: 10px 18px; font-size: 14px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Internet aloqasi yo'q</h1>
      <p>Ma'lumotlar serverdan olinadi, shuning uchun aloqa tiklanishi kerak.</p>
      <button onclick="location.reload()">Qayta urinish</button>
    </div>
  </body>
</html>
